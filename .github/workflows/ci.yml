name: cluster-ci

on:
  push:
    branches: [main]
  # Read the trusted base workflow; fork code never reaches a runner.
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: >-
      github.repository == 'Astatide1337/Skills' &&
      github.actor == 'Astatide1337' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.user.login == 'Astatide1337' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: astatide-skills-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Validate catalog and run offline evaluation tests
        run: |
          uv sync --frozen --python 3.13
          uv run --frozen python scripts/validate_catalog.py
          uv run --frozen python skills/verify-work/scripts/boundary_checks.py ci --dialect github --file .github/workflows/ci.yml
          uv run --frozen python -m unittest evals.tests.test_catalog_validation evals.tests.test_cli_installation evals.tests.test_portable_lint.PythonLintTests evals.tests.test_workflows evals.tests.test_skills_lifecycle -v

  workspace-tests:
    # Bubblewrap requires user namespaces denied by the restricted cluster runtime.
    # Standard hosted VM minutes are free only while this repository is public.
    if: >-
      github.repository == 'Astatide1337/Skills' && github.event.repository.private == false &&
      github.actor == 'Astatide1337' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.user.login == 'Astatide1337' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install distro Bubblewrap and verify its namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --unshare-all --ro-bind / / -- true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked supplemental lint tools outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/skills-lint"
          cp skills/code-review-and-quality/assets/portable-lint/package*.json "$RUNNER_TEMP/skills-lint/"
          npm ci --prefix "$RUNNER_TEMP/skills-lint" --ignore-scripts --no-audit --no-fund
      - name: Run complete offline evaluation suite
        env:
          SKILLS_LINT_RUNTIME: ${{ runner.temp }}/skills-lint
        run: |
          uv sync --frozen --python 3.13
          uv run --frozen python -m unittest discover -s evals/tests -v
