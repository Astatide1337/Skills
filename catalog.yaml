version: 1
# This is a lockfile, not a runtime downloader. Every exported skill is reviewed,
# copied from the source commit below, and served only from the image filesystem.
policy:
  runtime_fetch: false
  execute_skill_scripts: false
  skill_network_access: false
  credentials_in_skill_content: false
  default_profile: all
profiles:
  engineering-core:
    - systematic-debugging
    - verification-before-completion
    - writing-plans
    - executing-plans
    - using-git-worktrees
    - requesting-code-review
    - receiving-code-review
    - finishing-a-development-branch
    - code-review
    - commit
  web-engineering:
    - vercel-react-best-practices
    - web-design-guidelines
    - webapp-testing
    - playwright-cli
    - frontend-design
  mcp-and-infrastructure:
    - mcp-builder
    - cloudflare-deploy
  agent-manager:
    - grill-me
    - to-spec
    - to-tickets
    - prototype
    - research
    - domain-modeling
    - codebase-design
    - improve-codebase-architecture
    - diagnosing-bugs
    - handoff
  production-engineering:
    - source-driven-development
    - doubt-driven-development
    - incremental-implementation
    - api-and-interface-design
    - debugging-and-error-recovery
    - code-review-and-quality
    - code-simplification
    - security-and-hardening
    - performance-optimization
    - ci-cd-and-automation
    - shipping-and-launch
  video-and-media:
    - remotion-best-practices
  zero-token-architecture:
    - zero-token-boundary
    - evidence-gated-integration
    - minimalism-audit
  catalog-admin:
    - skill-scanner
    - skill-creator
    - writing-skills
    - find-skills
