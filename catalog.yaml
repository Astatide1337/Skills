version: 1
# This is a lockfile, not a runtime downloader. Every exported skill is reviewed,
# copied from the source commit below, and served only from the image filesystem.
policy:
  runtime_fetch: false
  execute_skill_scripts: false
  skill_network_access: false
  credentials_in_skill_content: false
  default_profile: all
profiles:
  engineering-core:
    - receiving-code-review
  web-engineering:
    - web-interface
  mcp-and-infrastructure:
    - cloudflare-deploy
  agent-manager:
    - grill-me
    - diagnosing-bugs
  production-engineering:
    - source-driven-development
    - api-and-interface-design
    - debugging-and-error-recovery
    - code-review-and-quality
    - code-simplification
    - security-and-hardening
    - performance-optimization
    - production-safety
    - systematic-debugging
    - verify-work
  zero-token-architecture:
    - minimalism-audit
  catalog-admin:
    - skill-creator
skills:
  - profile: engineering-core
    trust: established
    exported_path: skills/receiving-code-review/SKILL.md
    source: {repository: 'https://github.com/obra/superpowers', commit: 44c9b2d6e889982ac18c27d05a19fefe335194e1, path: skills/receiving-code-review}
  - profile: web-engineering
    trust: local-reviewed
    exported_path: skills/web-interface/SKILL.md
    source:
      composition:
        - {repository: 'https://github.com/vercel-labs/agent-skills', commit: 805687f34e8c10b420e3d11335a0ca2c3c90d992, path: skills/react-best-practices}
