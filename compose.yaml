services:
  skills-gateway:
    build:
      context: .
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    restart: unless-stopped
    depends_on:
      skills-gateway:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_SKILLS_TUNNEL_TOKEN:?CLOUDFLARE_SKILLS_TUNNEL_TOKEN is required}
