services:
  skills-gateway:
    build:
      context: .
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      default: {}
      mcp_gateway:
        aliases:
          - skills-gateway

networks:
  mcp_gateway:
    external: true
    name: sj6itrzqb4zbrpxu0raq94zi_mcp
