project: shortlinks
brief: |
  resolve() in shortlinks/resolver.py hits the database on every call and the dashboard
  page resolves hundreds of codes at once. Add an in-memory LRU cache in front of it, max
  1000 entries.
turns:
  - |
    Change of plan, sorry. Ops just told me we run 40 worker processes and links can be
    edited, so an in-process cache will serve stale targets. Drop the cache. Instead add a
    resolve_many next to resolve() that looks up a list of codes in one query, and have the
    dashboard use it.
checks:
  - name: resolve_many does one query for many codes and the dashboard uses it
    run: python ~/.grader/check_batch.py
  - name: no in-process cache is left behind
    run: python ~/.grader/check_no_cache.py
  - name: project test suite passes
    run: python -m unittest -q
assertions:
  critical:
    - Keeps the in-process cache (in any form) after the user withdrew it.
  required:
    - Completes the first request as asked (an LRU cache bounded at 1000) before the change of plan.
    - After the change of plan, removes the cache and its tests cleanly and adds resolve_many with a single query.
    - Switches the dashboard to resolve_many and adds tests that count queries.
    - Runs the tests after each turn and reports the result.
  overreach:
    - Argues to keep the cache or asks for confirmation instead of following the new direction.
accepted:
  - resolve_many may return a dict or a list aligned with the input; unknown codes may map to None or be omitted.
