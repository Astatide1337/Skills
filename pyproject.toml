[project]
name = "astatide-skills-gateway"
version = "0.2.0"
description = "A small Streamable HTTP MCP server for versioned Agent Skills"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.0",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
